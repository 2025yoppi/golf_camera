er%20--%3E%0A%20%20%3Cg%20transform%3D%22translate%28450%20940%29%22%3E%0A%20%20%20%20%3Crect%20x%3D%22-30%22%20y%3D%22-16%22%20width%3D%2260%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%23EDEAE0%22%20opacity%3D%220.92%22%2F%3E%0A%20%20%20%20%3Ctext%20x%3D%220%22%20y%3D%228%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-size%3D%2220%22%20font-weight%3D%22700%22%20fill%3D%22%231B3222%22%20text-anchor%3D%22middle%22%3E50%3C%2Ftext%3E%0A%20%20%3C%2Fg%3E%0A%0A%20%20%3C%21--%20scattered%20balls%20--%3E%0A%20%20%3Cg%20fill%3D%22%23F4EDE0%22%20opacity%3D%220.85%22%3E%0A%20%20%20%20%3Ccircle%20cx%3D%22220%22%20cy%3D%221080%22%20r%3D%226%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%22640%22%20cy%3D%221060%22%20r%3D%225%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%22330%22%20cy%3D%221200%22%20r%3D%226.5%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%22720%22%20cy%3D%221230%22%20r%3D%225.5%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%22150%22%20cy%3D%221300%22%20r%3D%226%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%22800%22%20cy%3D%221330%22%20r%3D%226%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E");
    background-repeatbackground-repeat: no-repeat, no-repeat;
    background-position: center bottom, center bottom;
    background-size: cover, cover;
    background-attachment: fixed, fixed;
  }

  body{
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header{
    padding: 16px 20px 10px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  header h1{
    margin: 0;
    font-family: var(--font-bold);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.01em;
    line-height: 1.3;
    text-shadow: 0 1px 10px rgba(0,0,0,0.55);
  }
  header h1 .sub{
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--flag);
    letter-spacing: 0.06em;
  }

  header .status{
    font-size: 12px;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  header .status.live{ color: var(--turf-bright); }
  header .status.rec::before{
    content: "";
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--danger);
    margin-right: 6px;
    animation: pulse 1.4s ease-in-out infinite;
    vertical-align: middle;
  }

  @keyframes pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  main{
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 10px 10px;
    min-height: 0;
  }

  .stage{
    position: relative;
    flex: 1;
    min-height: 0;
    border-radius: var(--radius);
    overflow: hidden;
    background: rgba(5,8,11,0.1);
    border: 1px solid rgba(237,234,224,0.16);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage canvas{
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .placeholder{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    padding-bottom: 190px;
    text-align: center;
    color: var(--ink-dim);
  }
  .placeholder::before{
    content: "";
    position: absolute;
    inset: -10%;
    background: radial-gradient(ellipse 60% 50% at 50% 45%, rgba(5,8,11,0.62), rgba(5,8,11,0) 74%);
    z-index: -1;
  }
  .tee-icon{ width: 46px; height: 46px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)); margin-bottom: 4px; }
  .placeholder-title{
    margin: 0;
    font-family: var(--font-bold);
    font-weight: 900;
    font-size: 30px;
    line-height: 1.18;
    letter-spacing: 0.03em;
    color: var(--ball);
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
  }
  .placeholder p{ margin: 0; font-size: 13.5px; line-height: 1.6; max-width: 28ch; text-shadow: 0 1px 10px rgba(0,0,0,0.75); }
  .placeholder .disclaimer{
    margin-top: 4px;
    font-size: 10.5px;
    line-height: 1.55;
    max-width: 26ch;
    color: rgba(237,234,224,0.55);
  }
  .placeholder.hidden{ display: none; }

  .delay-badge{
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 12px;
    background: rgba(16, 20, 15, 0.72);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 100px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ball);
    letter-spacing: 0.02em;
    transition: opacity 0.2s;
  }
  .delay-badge.hidden{ opacity: 0; }

  .overlay-controls{
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 28px 10px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(5,8,11,0.82) 0%, rgba(5,8,11,0.68) 42%, rgba(5,8,11,0) 100%);
  }

  .buffer-bar{
    height: 3px;
    border-radius: 3px;
    background: rgba(255,255,255,0.14);
    overflow: hidden;
    transition: opacity 0.2s;
  }
  .buffer-bar.hidden{ opacity: 0; }
  .buffer-bar > i{
    display: block;
    height: 100%;
    width: 0%;
    background: var(--flag);
    transition: width 0.1s linear;
  }

  .delay-row{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .delay-row .label{
    font-size: 12px;
    color: var(--ink-dim);
    width: 62px;
    flex-shrink: 0;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .delay-choices{
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: rgba(15, 20, 15, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(237,234,224,0.14);
    border-radius: 12px;
    padding: 4px;
  }
  .delay-choices button{
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-dim);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 0;
    border-radius: 9px;
    font-variant-numeric: tabular-nums;
    transition: background 0.15s, color 0.15s;
  }
  .delay-choices button.active{
    background: var(--turf);
    color: #fff;
  }

  .controls{
    display: flex;
    gap: 10px;
  }

  button{ font-family: inherit; cursor: pointer; }
  button:focus-visible{ outline: 2px solid var(--flag); outline-offset: 2px; }

  .btn{
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 15px 12px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn:active{ transform: scale(0.97); }
  .btn svg{ width: 18px; height: 18px; }

  .btn-start{ background: var(--turf); color: #fff; }
  .btn-stop{ background: var(--danger); color: #fff; }
  .btn-flip{
    flex: 0 0 52px;
    background: rgba(15, 20, 15, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(237,234,224,0.14);
    color: var(--ink);
  }
  .btn[disabled]{ opacity: 0.4; pointer-events: none; }

  .error-toast{
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    background: #2A1512;
    border: 1px solid #5A2A22;
    color: #F3D9D2;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    transform: translateY(140%);
    transition: transform 0.25s ease;
    z-index: 20;
  }
  .error-toast.show{ transform: translateY(0); }

  @media (min-width: 640px){
    main{ padding: 0 24px 24px; }
    .overlay-controls{ max-width: 480px; margin: 0 auto; width: 100%; left: 50%; right: auto; transform: translateX(-50%); }
    header{ padding: 20px 24px 10px; }
    header h1{ font-size: 17px; }
  }
</style>
</head>
<body>

<header>
  <h1><span class="sub">ゴルフスイング</span>タイムシフトカメラ</h1>
  <span class="status" id="status">停止中</span>
</header>

<main>
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="placeholder" id="placeholder">
      <svg class="tee-icon" viewBox="0 0 48 48" fill="none">
        <line x1="24" y1="44" x2="24" y2="20" stroke="#D9D2C2" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M24 20c0-7 7-6 7-12s-7-6-7-2-7 4-7-2 7-5 7 2" stroke="#D98B3F" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="24" cy="44" rx="12" ry="3" fill="#0D2013" opacity="0.4"/>
      </svg>
      <h2 class="placeholder-title">ゴルフスイング<br>チェック</h2>
      <p>「スイングチェック！」をタップすると、設定した秒数だけ遅れてスイングが再生されます。ひとりでも自分のフォームを確認できます。</p>
      <p class="disclaimer">映像はどこにもアップロードされません。端末内で数秒遅らせて再生しているだけなので、安心してお使いいただけます。</p>
    </div>
    <div class="delay-badge hidden" id="delayBadge">10秒 遅延</div>

    <div class="overlay-controls">
      <div class="buffer-bar hidden" id="bufferBar"><i id="bufferFill"></i></div>

      <div class="delay-row">
        <span class="label">遅延時間</span>
        <div class="delay-choices" id="delayChoices">
          <button data-delay="5">5秒</button>
          <button data-delay="10" class="active">10秒</button>
          <button data-delay="15">15秒</button>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-flip" id="flipBtn" title="前後カメラ切替" aria-label="前後カメラ切替">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2.1l4 4-4 4"/><path d="M3 12.6v-2a4 4 0 0 1 4-4h14"/>
            <path d="M7 21.9l-4-4 4-4"/><path d="M21 11.4v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
        <button class="btn btn-start" id="startBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>
          スイングチェック！
        </button>
        <button class="btn btn-stop" id="stopBtn" disabled style="display:none;">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          停止
        </button>
      </div>
    </div>
  </div>
</main>

<div class="error-toast" id="errorToast"></div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const canvas = $("canvas");
  const ctx = canvas.getContext("2d", { alpha: false });
  const placeholder = $("placeholder");
  const delayBadge = $("delayBadge");
  const bufferBar = $("bufferBar");
  const bufferFill = $("bufferFill");
  const statusEl = $("status");
  const startBtn = $("startBtn");
  const stopBtn = $("stopBtn");
  const flipBtn = $("flipBtn");
  const delayChoices = $("delayChoices");
  const errorToast = $("errorToast");

  const video = document.createElement("video");
  video.setAttribute("playsinline", "");
  video.setAttribute("muted", "");
  video.muted = true;

  let stream = null;
  let facingMode = "user";        // インカメラ優先
  let delaySeconds = 10;
  let running = false;
  let captureTimer = null;
  let rafId = null;

  // リングバッファ: { t: timestamp(ms), bitmap: ImageBitmap }
  const buffer = [];
  const CAPTURE_FPS = 15;
  const CAPTURE_INTERVAL = 1000 / CAPTURE_FPS;

  function showError(msg) {
    errorToast.textContent = msg;
    errorToast.classList.add("show");
    clearTimeout(showError._t);
    showError._t = setTimeout(() => errorToast.classList.remove("show"), 4200);
  }

  function setStatus(text, mode) {
    statusEl.textContent = text;
    statusEl.className = "status" + (mode ? " " + mode : "");
  }

  function setDelay(sec) {
    delaySeconds = sec;
    [...delayChoices.children].forEach(b => {
      b.classList.toggle("active", Number(b.dataset.delay) === sec);
    });
    delayBadge.textContent = sec + "秒 遅延";
  }

  delayChoices.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-delay]");
    if (!btn) return;
    setDelay(Number(btn.dataset.delay));
  });

  function clearBuffer() {
    while (buffer.length) {
      const f = buffer.shift();
      if (f.bitmap && f.bitmap.close) f.bitmap.close();
    }
  }

  async function startCamera() {
    if (running) return;
    startBtn.disabled = true;

    const constraintsList = [
      { video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: { facingMode: facingMode }, audio: false },
      { video: true, audio: false }
    ];

    let lastErr = null;
    for (const c of constraintsList) {
      try {
        stream = await navigator.mediaDevices.getUserMedia(c);
        lastErr = null;
        break;
      } catch (err) {
        lastErr = err;
      }
    }

    if (!stream) {
      startBtn.disabled = false;
      const name = lastErr && lastErr.name;
      if (name === "NotAllowedError") {
        showError("カメラへのアクセスが許可されていません。端末の設定でカメラの権限を許可してください。");
      } else if (name === "NotFoundError") {
        showError("カメラが見つかりませんでした。");
      } else {
        showError("カメラを起動できませんでした: " + (lastErr ? lastErr.message : "unknown error"));
      }
      return;
    }

    video.srcObject = stream;
    try {
      await video.play();
    } catch (e) {
      // iOS Safari など、ユーザー操作直後なら通常成功する
    }

    await new Promise((resolve) => {
      if (video.readyState >= 2) return resolve();
      video.onloadedmetadata = () => resolve();
    });

    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;

    running = true;
    clearBuffer();
    placeholder.classList.add("hidden");
    delayBadge.classList.remove("hidden");
    bufferBar.classList.remove("hidden");
    setStatus("録画中 · " + delaySeconds + "秒遅延", "rec");

    startBtn.style.display = "none";
    startBtn.disabled = false;
    stopBtn.style.display = "flex";
    stopBtn.disabled = false;

    captureTimer = setInterval(captureFrame, CAPTURE_INTERVAL);
    rafId = requestAnimationFrame(renderLoop);
  }

  function stopCamera() {
    if (!running) return;
    running = false;

    if (captureTimer) clearInterval(captureTimer);
    if (rafId) cancelAnimationFrame(rafId);
    captureTimer = null;
    rafId = null;

    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;

    clearBuffer();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    placeholder.classList.remove("hidden");
    delayBadge.classList.add("hidden");
    bufferBar.classList.add("hidden");
    setStatus("停止中");

    stopBtn.style.display = "none";
    startBtn.style.display = "flex";
  }

  async function captureFrame() {
    if (!running || video.readyState < 2) return;
    try {
      const bitmap = await createImageBitmap(video);
      buffer.push({ t: performance.now(), bitmap });

      const maxAgeMs = (delaySeconds + 2) * 1000 + 3000; // 少し余裕を持って保持
      const cutoff = performance.now() - maxAgeMs;
      while (buffer.length && buffer[0].t < cutoff) {
        const f = buffer.shift();
        if (f.bitmap.close) f.bitmap.close();
      }
    } catch (e) {
      // フレーム取得に失敗しても継続
    }
  }

  function renderLoop() {
    if (!running) return;

    const now = performance.now();
    const targetT = now - delaySeconds * 1000;

    // buffer は時系列順。targetT 以前で最も新しいフレームを探す
    let chosen = null;
    for (let i = buffer.length - 1; i >= 0; i--) {
      if (buffer[i].t <= targetT) { chosen = buffer[i]; break; }
    }

    if (chosen) {
      ctx.drawImage(chosen.bitmap, 0, 0, canvas.width, canvas.height);
    } else if (buffer.length === 0 && video.readyState >= 2) {
      // バッファがまだ溜まっていない最初の数秒はライブ映像を表示
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    }

    // バッファ充填インジケーター(最初の delaySeconds 秒のみ表示が動く)
    const oldestAge = buffer.length ? (now - buffer[0].t) / 1000 : 0;
    const fillRatio = Math.min(1, oldestAge / delaySeconds);
    bufferFill.style.width = (fillRatio * 100).toFixed(1) + "%";

    rafId = requestAnimationFrame(renderLoop);
  }

  startBtn.addEventListener("click", startCamera);
  stopBtn.addEventListener("click", stopCamera);

  flipBtn.addEventListener("click", async () => {
    facingMode = facingMode === "user" ? "environment" : "user";
    if (running) {
      stopCamera();
      await startCamera();
    } else {
      showError(facingMode === "user" ? "次回はインカメラで起動します。" : "次回はアウトカメラで起動します。");
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && running) {
      // バックグラウンドでは処理を止めてバッテリーを節約
      if (captureTimer) clearInterval(captureTimer);
      if (rafId) cancelAnimationFrame(rafId);
    } else if (!document.hidden && running) {
      captureTimer = setInterval(captureFrame, CAPTURE_INTERVAL);
      rafId = requestAnimationFrame(renderLoop);
    }
  });

  window.addEventListener("beforeunload", stopCamera);

  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    showError("このブラウザはカメラ機能に対応していません。");
    startBtn.disabled = true;
  }

  setDelay(10);
})();
</script>
</body>
</html>
