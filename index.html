  body{
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }


  @keyframes pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  main{
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0;
    min-height: 0;
  }

  .stage{
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage canvas{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .placeholder{
    position: absolute;
    inset: 0;
  }
  .placeholder.hidden{ display: none; }

  .delay-badge{
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 12px;
    background: rgba(16, 20, 15, 0.72);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 100px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ball);
    letter-spacing: 0.02em;
    transition: opacity 0.2s;
  }
  .delay-badge.hidden{ opacity: 0; }

  .overlay-controls{
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 28px 10px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(5,8,11,0.82) 0%, rgba(5,8,11,0.68) 42%, rgba(5,8,11,0) 100%);
  }

  .buffer-bar{
    height: 3px;
    border-radius: 3px;
    background: rgba(255,255,255,0.14);
    overflow: hidden;
    transition: opacity 0.2s;
  }
  .buffer-bar.hidden{ opacity: 0; }
  .buffer-bar > i{
    display: block;
    height: 100%;
    width: 0%;
    background: var(--flag);
    transition: width 0.1s linear;
  }

  .delay-label{
    font-size: 11px;
    color: var(--ink-dim);
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    margin-bottom: 6px;
  }
  .delay-row{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .delay-row .label{
    font-size: 12px;
    color: var(--ink-dim);
    width: 62px;
    flex-shrink: 0;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .delay-choices{
    flex: 1;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    background: rgba(15, 20, 15, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(237,234,224,0.14);
    border-radius: 12px;
    padding: 4px;
  }
  .delay-choices button{
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-dim);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 0;
    border-radius: 9px;
    font-variant-numeric: tabular-nums;
    transition: background 0.15s, color 0.15s;
  }
  .delay-choices button.active{
    background: #fff;
    color: var(--turf);
  }

  button{ font-family: inherit; cursor: pointer; }
  button:focus-visible{ outline: 2px solid var(--flag); outline-offset: 2px; }

  .btn-flip-inline{
    flex: 0 0 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 12px;
    background: #fff;
    color: var(--turf);
  }
  .btn-flip-inline:active{ transform: scale(0.97); }

  .btn-action{
    flex: 1;
    min-width: 0;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 10px;
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
  }
  .btn-action span{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-action svg{ flex-shrink: 0; width: 16px; height: 16px; }
  .btn-action:active{ transform: scale(0.97); }
  .btn-action--start{ background: #fff; color: var(--turf); flex: 1.6; }
  .btn-action--stop{ background: var(--danger); flex: 1.6; }
  .btn-action[disabled]{ opacity: 0.4; pointer-events: none; }

  .error-toast{
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    background: #2A1512;
    border: 1px solid #5A2A22;
    color: #F3D9D2;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    transform: translateY(140%);
    transition: transform 0.25s ease;
    z-index: 20;
  }
  .error-toast.show{ transform: translateY(0); }

  /* --- Ad slots --- */
  .ad-banner{
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 10px;
    margin: 8px 10px 0;
    background: rgba(15, 20, 15, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(237,234,224,0.14);
    border-radius: 10px;
    font-size: 11.5px;
    color: var(--ink-dim);
    flex: 0 0 auto;
  }
  .ad-banner .ad-banner__label,
  .ad-banner .ad-banner__close{
    margin-top: 1px;
  }
  .ad-banner--bottom{ margin: 0 10px 8px; }
  .ad-banner__label{
    flex-shrink: 0;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: rgba(237,234,224,0.5);
    border: 1px solid rgba(237,234,224,0.3);
    border-radius: 4px;
    padding: 1px 4px;
  }
  .ad-banner__link{
    flex: 1;
    min-width: 0;
    color: var(--ball);
    text-decoration: none;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.35;
  }
  .ad-banner__link:active{ opacity: 0.7; }
  .ad-banner__img-link{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-width: 0;
  }
  .ad-banner__img{
    max-height: 34px;
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 4px;
  }
  .ad-banner__close{
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 50%;
    background: rgba(237,234,224,0.14);
    color: var(--ink-dim);
    font-size: 13px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ad-banner.hidden{ display: none; }

  .ad-popup-overlay{
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(5,8,11,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .ad-popup-overlay.hidden{ display: none; }
  .ad-popup{
    position: relative;
    width: 100%;
    max-width: 340px;
    background: linear-gradient(180deg, #1B231A, #12160F);
    border: 1px solid rgba(237,234,224,0.16);
    border-radius: 18px;
    padding: 26px 22px 22px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .ad-popup__badge{
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: rgba(237,234,224,0.55);
    border: 1px solid rgba(237,234,224,0.3);
    border-radius: 4px;
    padding: 2px 6px;
    margin-bottom: 12px;
  }
  .ad-popup h3{
    margin: 0 0 10px;
    font-family: var(--font-bold);
    font-weight: 900;
    font-size: 19px;
    line-height: 1.4;
    color: var(--ball);
  }
  .ad-popup p{
    margin: 0 0 18px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-dim);
  }
  .ad-popup__cta{
    display: inline-block;
    width: 100%;
    padding: 12px;
    background: var(--turf);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
    border-radius: 12px;
  }
  .ad-popup__cta:active{ opacity: 0.85; }
  .ad-popup__close{
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: rgba(237,234,224,0.12);
    color: var(--ink);
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rakuten-ad-card{
    background: #fff;
    border: 1px solid #cfd3d4;
    border-radius: 12px;
    padding: 14px 12px 12px;
    text-align: center;
  }
  .rakuten-ad-card__img{

<div class="error-toast" id="errorToast"></div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);

  // --- ボタン共通のクリック音 ---
  let clickAudioCtx = null;
  function playClickSound() {
    try {
      if (!clickAudioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        clickAudioCtx = new AC();
      }
      if (clickAudioCtx.state === "suspended") clickAudioCtx.resume();
      const ctx = clickAudioCtx;
      const now = ctx.currentTime;

      function playTone(freq, startTime, peakGain, duration) {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = freq;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }

      // 「ピロン！」という明るい2音チャイム
      playTone(988, now, 0.2, 0.14);
      playTone(1568, now + 0.09, 0.22, 0.24);
    } catch (e) {
      // 音声再生に失敗しても操作自体は継続
    }
  }
  document.addEventListener("click", (e) => {
    if (e.target.closest("button")) playClickSound();
  }, true);

  const stage = $("stage");
  const canvas = $("canvas");
  const ctx = canvas.getContext("2d", { alpha: false });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  // メモリ節約用: バッファに溜めるフレームは縮小して保持する(表示解像度とは別)
  const BUFFER_W = 480;
  const BUFFER_H = 270;
  const bufCanvas = document.createElement("canvas");
  bufCanvas.width = BUFFER_W;
  bufCanvas.height = BUFFER_H;
  const bufCtx = bufCanvas.getContext("2d", { alpha: false });

  const placeholder = $("placeholder");
  const delayBadge = $("delayBadge");
  const bufferBar = $("bufferBar");
  const bufferFill = $("bufferFill");
  const statusEl = $("status");
  const startBtn = $("startBtn");
  const stopBtn = $("stopBtn");
  const flipBtn = $("flipBtn");
  const delayChoices = $("delayChoices");
  const errorToast = $("errorToast");

  const video = document.createElement("video");
  video.setAttribute("playsinline", "");
  video.setAttribute("muted", "");
  video.muted = true;

  let stream = null;
  let facingMode = "user";        // インカメラ優先
  let delaySeconds = 10;
  let running = false;
  let captureTimer = null;
  let rafId = null;

  // リングバッファ: { t: timestamp(ms), bitmap: ImageBitmap }
  const buffer = [];
  const CAPTURE_FPS = 30;
  const CAPTURE_INTERVAL = 1000 / CAPTURE_FPS;

  function showError(msg) {
    errorToast.textContent = msg;
    errorToast.classList.add("show");
    clearTimeout(showError._t);
    showError._t = setTimeout(() => errorToast.classList.remove("show"), 4200);
  }

  function setStatus(text, mode) {
    if (!statusEl) return;
    statusEl.textContent = text;
    statusEl.className = "status-badge" + (mode ? " " + mode : "");
  }

  function setDelay(sec) {
    delaySeconds = sec;
    [...delayChoices.children].forEach(b => {
      b.classList.toggle("active", Number(b.dataset.delay) === sec);
    });
    delayBadge.textContent = sec + "秒 遅延";
  }

  delayChoices.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-delay]");
    if (!btn) return;
    setDelay(Number(btn.dataset.delay));
  });

  function clearBuffer() {
    while (buffer.length) {
      const f = buffer.shift();
      if (f.bitmap && f.bitmap.close) f.bitmap.close();
    }
  }

  async function startCamera() {
    if (running) return;
    startBtn.disabled = true;
    hideAdPopup();

    const constraintsList = [
      { video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false },
      { video: { facingMode: facingMode }, audio: false },
      { video: true, audio: false }
    ];

    let lastErr = null;
    for (const c of constraintsList) {
      try {
        stream = await navigator.mediaDevices.getUserMedia(c);
        lastErr = null;
        break;
      } catch (err) {
        lastErr = err;
      }
    }

    if (!stream) {
      startBtn.disabled = false;
      const name = lastErr && lastErr.name;
      if (name === "NotAllowedError") {
        showError("カメラへのアクセスが許可されていません。端末の設定でカメラの権限を許可してください。");
      } else if (name === "NotFoundError") {
        showError("カメラが見つかりませんでした。");
      } else {
        showError("カメラを起動できませんでした: " + (lastErr ? lastErr.message : "unknown error"));
      }
      return;
    }

    video.srcObject = stream;
    try {
      await video.play();
    } catch (e) {
      // iOS Safari など、ユーザー操作直後なら通常成功する
    }

    await new Promise((resolve) => {
      if (video.readyState >= 2) return resolve();
      video.onloadedmetadata = () => resolve();
    });

    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;

    running = true;
    clearBuffer();
    placeholder.classList.add("hidden");
    delayBadge.classList.remove("hidden");
    bufferBar.classList.remove("hidden");
    setStatus("録画中 · " + delaySeconds + "秒遅延", "rec");

    startBtn.style.display = "none";
    startBtn.disabled = false;
    stopBtn.style.display = "flex";
    stopBtn.disabled = false;

    captureTimer = setInterval(captureFrame, CAPTURE_INTERVAL);
    rafId = requestAnimationFrame(renderLoop);
  }

  function stopCamera() {
    if (!running) return;
    running = false;

    if (captureTimer) clearInterval(captureTimer);
    if (rafId) cancelAnimationFrame(rafId);
    captureTimer = null;
    rafId = null;

    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;

    clearBuffer();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    placeholder.classList.remove("hidden");
    delayBadge.classList.add("hidden");
    bufferBar.classList.add("hidden");
    setStatus("停止中");

    stopBtn.style.display = "none";
    startBtn.style.display = "flex";
  }

  async function captureFrame() {
    if (!running || video.readyState < 2) return;
    try {
      // 表示映像はそのままに、バッファ保持用だけ縮小してメモリを節約する
      bufCtx.drawImage(video, 0, 0, BUFFER_W, BUFFER_H);
      const bitmap = await createImageBitmap(bufCanvas);
      buffer.push({ t: performance.now(), bitmap });

      const maxAgeMs = (delaySeconds + 1) * 1000 + 1500; // 少し余裕を持って保持
      const cutoff = performance.now() - maxAgeMs;
      while (buffer.length && buffer[0].t < cutoff) {
        const f = buffer.shift();
        if (f.bitmap.close) f.bitmap.close();
      }
    } catch (e) {
      // フレーム取得に失敗しても継続
    }
  }

  function renderLoop() {
    if (!running) return;

    const now = performance.now();
    const targetT = now - delaySeconds * 1000;

    // buffer は時系列順。targetT 以前で最も新しいフレームを探す
    let chosen = null;
    for (let i = buffer.length - 1; i >= 0; i--) {
      if (buffer[i].t <= targetT) { chosen = buffer[i]; break; }
    }

    if (chosen) {
      ctx.drawImage(chosen.bitmap, 0, 0, canvas.width, canvas.height);
    } else if (buffer.length === 0 && video.readyState >= 2) {
      // バッファがまだ溜まっていない最初の数秒はライブ映像を表示
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    }

    // バッファ充填インジケーター(最初の delaySeconds 秒のみ表示が動く)
    const oldestAge = buffer.length ? (now - buffer[0].t) / 1000 : 0;
    const fillRatio = Math.min(1, oldestAge / delaySeconds);
    bufferFill.style.width = (fillRatio * 100).toFixed(1) + "%";

    rafId = requestAnimationFrame(renderLoop);
  }

  startBtn.addEventListener("click", startCamera);
  stopBtn.addEventListener("click", stopCamera);

  flipBtn.addEventListener("click", async () => {
    facingMode = facingMode === "user" ? "environment" : "user";
    if (running) {
      stopCamera();
      await startCamera();
    } else {
      showError(facingMode === "user" ? "次回はインカメラで起動します。" : "次回はアウトカメラで起動します。");
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && running) {
      // バックグラウンドでは処理を止めてバッテリーを節約
      if (captureTimer) clearInterval(captureTimer);
      if (rafId) cancelAnimationFrame(rafId);
    } else if (!document.hidden && running) {
      captureTimer = setInterval(captureFrame, CAPTURE_INTERVAL);
      rafId = requestAnimationFrame(renderLoop);
    }
  });

  window.addEventListener("beforeunload", stopCamera);

  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    showError("このブラウザはカメラ機能に対応していません。");
    startBtn.disabled = true;
  }

  // --- Ad slots ---
  const AD_POPUP_KEY = "gc_ad_popup_shown_v1";
  const adPopupOverlay = $("adPopupOverlay");

  function hideAdPopup() {
    adPopupOverlay.classList.add("hidden");
  }

  function showAdPopupIfNeeded() {
    try {
      if (!sessionStorage.getItem(AD_POPUP_KEY)) {
        adPopupOverlay.classList.remove("hidden");
        sessionStorage.setItem(AD_POPUP_KEY, "1");
      }
    } catch (e) {
      // sessionStorage が使えない環境ではポップアップを出さずスキップ
    }
  }

  $("adPopupClose").addEventListener("click", hideAdPopup);
  adPopupOverlay.addEventListener("click", (e) => {
    if (e.target === adPopupOverlay) hideAdPopup();
  });

  $("adBannerTopClose").addEventListener("click", () => {
    $("adBannerTop").classList.add("hidden");
  });
  $("adBannerBottomClose").addEventListener("click", () => {
    $("adBannerBottom").classList.add("hidden");
  });

  showAdPopupIfNeeded();

  setDelay(10);
})();
</script>
